<div class="p-6 md:p-10 bg-[#FBF7E7] min-h-screen font-sans text-slate-900">
  
  <header class="mb-10 text-center">
    <h1 class="font-serif text-5xl font-normal text-slate-950 tracking-tight">Gestion des ouvrages</h1>
  </header>

  <section class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100 mb-10">
    <div class="grid grid-cols-1 md:grid-cols-[auto,1fr,auto] gap-6 items-center">
      
      <button (click)="openNewBookModal()" class="bg-[#585942] text-white h-24 w-48 rounded-3xl flex items-center justify-center text-xl font-light tracking-wide hover:bg-opacity-90 transition duration-150 shadow-md">
        Nouvel ouvrage
      </button>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-4">
    
        <div class="relative">
          <label class="absolute -top-2.5 left-3 bg-white px-1 text-xs text-slate-500">Titre</label>
          <input type="text" class="w-full h-12 px-4 border border-slate-300 rounded-full focus:ring-2 focus:ring-[#949577] focus:border-[#949577] outline-none transition">
        </div>

        <div class="relative">
          <label class="absolute -top-2.5 left-3 bg-white px-1 text-xs text-slate-500">Disponibilité</label>
          <select class="w-full h-12 px-4 border border-slate-300 rounded-full appearance-none bg-white focus:ring-2 focus:ring-[#949577] focus:border-[#949577] outline-none transition">
            <option value="">Tous</option>
            <option value="true">Disponible</option>
            <option value="false">Indisponible</option>
          </select>
          <svg class="w-5 h-5 absolute right-4 top-3.5 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </div>

        <div class="relative">
          <label class="absolute -top-2.5 left-3 bg-white px-1 text-xs text-slate-500">Auteur</label>
          <input type="text" class="w-full h-12 px-4 border border-slate-300 rounded-full focus:ring-2 focus:ring-[#949577] focus:border-[#949577] outline-none transition">
        </div>

        <div class="relative">
          <label class="absolute -top-2.5 left-3 bg-white px-1 text-xs text-slate-500">Catégories</label>
          <select class="w-full h-12 px-4 border border-slate-300 rounded-full appearance-none bg-white focus:ring-2 focus:ring-[#949577] focus:border-[#949577] outline-none transition">
            <option value="">Toutes</option>
          </select>
          <svg class="w-5 h-5 absolute right-4 top-3.5 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </div>

        <div class="relative sm:col-span-2 lg:col-span-1">
          <label class="absolute -top-2.5 left-3 bg-white px-1 text-xs text-slate-500">ISBN</label>
          <input type="text" class="w-full h-12 px-4 border border-slate-300 rounded-full focus:ring-2 focus:ring-[#949577] focus:border-[#949577] outline-none transition">
        </div>
      </div>

      <button class="bg-[#585942] text-white h-24 w-48 rounded-3xl flex items-center justify-center text-xl font-light tracking-wide hover:bg-opacity-90 transition duration-150 shadow-md mt-4 md:mt-0 justify-self-end">
        Rechercher
      </button>

    </div>
  </section>

  <section class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100">
    
    @if (isLoading()) {
      <div class="py-12 text-center text-slate-500 font-light">
        Chargement des ouvrages...
      </div>
    } @else {
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm border-collapse">
          
          <thead class="border-b border-slate-200 text-slate-600 font-light">
            <tr>
              <th class="p-4 pl-6 font-light w-[28%]">Titre</th>
              <th class="p-4 font-light w-[20%]">Auteur</th>
              <th class="p-4 font-light w-[20%]">Genre</th>
              <th class="p-4 font-light w-[14%]">ISBN</th>
              <th class="p-4 pr-6 font-light w-[18%] text-right">Actions</th>
            </tr>
          </thead>
          
          <tbody class="divide-y divide-slate-100">
            @for (book of books(); track book.id) {
              <tr class="hover:bg-slate-50">
                <td class="p-4 pl-6 font-medium text-slate-950 align-top pt-5">{{ book.title }}</td>
                <td class="p-4 align-top pt-5">{{ book.author.join(', ') }}</td>
                <td class="p-4 align-top pt-5">{{ book.genres.join(', ') }}</td>
                <td class="p-4 align-top pt-5">{{ book.isbn }}</td>
                <td class="p-4 pr-6 align-top pt-3 text-right">
                  <div class="flex items-center justify-end gap-2">
                    <a [routerLink]="['copies', book.id]" class="bg-[#585942] text-white px-4 py-2.5 rounded-full text-xs font-light tracking-wide hover:bg-opacity-90 transition shadow-sm inline-block">
                      Exemplaires
                    </a>
                    <button class="border border-[#585942] text-[#585942] px-4 py-2.5 rounded-full text-xs font-light tracking-wide hover:bg-slate-50 transition shadow-sm">
                      Modifier
                    </button>
                  </div>
                </td>
              </tr>
            } @empty {
              <tr>
                <td colspan="5" class="py-8 text-center text-slate-400 font-light">Aucun ouvrage trouvé.</td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    }
  </section>

</div>
