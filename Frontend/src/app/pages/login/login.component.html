<div class="flex items-center justify-center min-h-screen">
  <form
    class="w-full max-w-sm bg-white p-10 rounded-lg shadow-md"
    (ngSubmit)="onSubmit()"
    #loginForm="ngForm"
  >
    <h1 class="text-2xl font-semibold text-center mb-6">Connexion</h1>

    <div class="mb-5 flex flex-col">
      <label for="email" class="text-sm text-gray-700 mb-1.5">E-mail</label>
      <input
        id="email"
        name="email"
        type="email"
        [(ngModel)]="email"
        required
        email
        #emailField="ngModel"
        class="px-3 py-2.5 border border-gray-300 rounded-md text-sm focus:outline-none focus:border-indigo-600"
      />
      <span
        class="text-red-600 text-xs mt-1.5"
        *ngIf="emailField.invalid && emailField.touched"
      >
        Veuillez saisir une adresse e-mail valide.
      </span>
    </div>

    <div class="mb-5 flex flex-col">
      <label for="password" class="text-sm text-gray-700 mb-1.5">Mot de passe</label>
      <input
        id="password"
        name="password"
        type="password"
        [(ngModel)]="password"
        required
        minlength="8"
        #passwordField="ngModel"
        class="px-3 py-2.5 border border-gray-300 rounded-md text-sm focus:outline-none focus:border-indigo-600"
      />
      <span
        class="text-red-600 text-xs mt-1.5"
        *ngIf="passwordField.invalid && passwordField.touched"
      >
        Le mot de passe doit contenir au moins 8 caractères.
      </span>
    </div>

    <p class="text-red-600 text-xs mb-4" *ngIf="errorMessage()">{{ errorMessage() }}</p>

    <button
      type="submit"
      [disabled]="loginForm.invalid || isLoading()"
      class="w-full py-2.5 bg-[#D6B76A] text-white rounded-md text-sm font-medium
             hover:bg-[#d4a42f] disabled:bg-[#dbd1b6] disabled:cursor-not-allowed transition-colors"
    >
      {{ isLoading() ? 'Connexion en cours...' : 'Se connecter' }}
    </button>

    <p class="text-center text-sm mt-5 text-gray-600">
      Vous n'avez pas de compte ?
      <a routerLink="/register" class="text-indigo-600 hover:underline">S'inscrire</a>
    </p>
  </form>
</div>
